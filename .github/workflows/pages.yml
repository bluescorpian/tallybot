name: Web flasher

# Deploys flasher/ to GitHub Pages with the firmware from the latest published release, so
# the flasher always installs what the release page offers. The image is copied onto Pages
# (not linked) because release downloads don't send CORS headers, and the browser flasher
# fetches the image with a cross-origin request.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Assemble the site
        env:
          GH_TOKEN: ${{ github.token }}
          # The published release; a manual run falls back to the latest one.
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir site
          cp flasher/index.html site/
          cp app/src-tauri/icons/128x128.png site/icon.png
          tag=${TAG:-$(gh release view --json tagName -q .tagName)}
          # The release's asset names (scripts/release-assets.mjs).
          image=$(node scripts/release-assets.mjs name firmware-image)
          manifest=$(node scripts/release-assets.mjs name firmware-manifest)
          # Versioned name on the site: the CDN in front of Pages caches .bin files, so a
          # fixed name would keep serving the previous release's firmware after a publish.
          bin="${image%.bin}-${tag#v}.bin"
          gh release download "$tag" --pattern "$image" --output "site/$bin"
          # The firmware's own version (firmware/VERSION, staged beside the image), not the app
          # tag: a release that leaves the firmware alone keeps the version the lights report.
          gh release download "$tag" --pattern "$manifest" --output firmware.json
          fw=$(jq -er '.version' firmware.json)
          jq -n --arg v "$fw" --arg bin "$bin" '{
            name: "TallyBot",
            version: $v,
            new_install_prompt_erase: true,
            builds: [{ chipFamily: "ESP32-C3",
                       parts: [{ path: $bin, offset: 0 }] }]
          }' > site/manifest.json
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
