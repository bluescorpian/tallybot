name: Release

# Pushing a `vX.Y.Z` tag builds the firmware image, then the Windows and Linux installers
# with that image bundled (the in-app flasher installs only the firmware released with the
# app), then opens a DRAFT GitHub Release with them attached, plus the updater signatures.
# Publishing that draft (by hand, after a look) triggers pages.yml, which ships the firmware
# to the web flasher, and update-manifest.yml, which offers the release to installed apps.
#
# A manual run (Actions → Release → Run workflow) builds everything as workflow artifacts
# without creating a release, to check the pipeline before tagging.
#
# Unlike ci.yml this doesn't use the Nix dev shell: binaries built against the Nix store
# don't run on other distros, and the sidecar's pkg step can only emit V8 bytecode off
# NixOS. Release builds use each runner's stock toolchain instead.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the previous tag, for the firmware/VERSION check
      # The same check ci.yml runs on every PR, plus (on a tag) the tag matching the version
      # and a firmware change since the last tag having bumped firmware/VERSION.
      - id: v
        name: Versions agree
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            node scripts/check-release.mjs --tag "$GITHUB_REF_NAME"
          else
            node scripts/check-release.mjs
          fi
          echo "version=$(jq -r .version app/package.json)" >> "$GITHUB_OUTPUT"

  windows:
    needs: [version, firmware]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # The firmware this release ships, bundled so the in-app flasher installs exactly it.
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: app/src-tauri/resources/firmware
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            app/pnpm-lock.yaml
            app/sidecar/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Install dependencies
        run: |
          pnpm -C app/sidecar install --frozen-lockfile
          pnpm -C app install --frozen-lockfile
      # beforeBuildCommand builds the frontend and the sidecar binary; bundling makes both
      # the NSIS setup .exe (per-user install, no admin needed) and an .msi.
      # tauri.release.conf.json adds the signed updater artifacts (release builds only, so a
      # local `tauri build` doesn't need the private key).
      - name: Build
        run: pnpm -C app tauri build --config src-tauri/tauri.release.conf.json
        # Signs the installers for the in-app updater: the app trusts
        # only the public key in tauri.conf.json. The key has no password.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      # The packaged sidecar is a different program from the source CI tests (pkg runtime, bundle,
      # on-disk atem-connection worker), and the updater pushes a release to every install: boot
      # it before anything is attached.
      - name: Boot the packaged sidecar
        run: node app/sidecar/smoke-boot.mjs app/src-tauri/binaries/tallybot-sidecar-x86_64-pc-windows-msvc.exe
      - name: Collect installers + portable zip
        shell: pwsh
        run: |
          $v = '${{ needs.version.outputs.version }}'
          # Asset names come from scripts/release-assets.mjs, which update-manifest.yml reads too.
          $nsis = node scripts/release-assets.mjs name nsis $v
          $msi = node scripts/release-assets.mjs name msi $v
          $zip = node scripts/release-assets.mjs name portable $v
          $rel = 'app\src-tauri\target\release'
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "$rel\bundle\nsis\*.exe" "dist\$nsis"
          Copy-Item "$rel\bundle\msi\*.msi" "dist\$msi"
          # The updater signatures; update-manifest.yml puts them in latest.json on publish.
          Copy-Item "$rel\bundle\nsis\*.exe.sig" "dist\$nsis.sig"
          Copy-Item "$rel\bundle\msi\*.msi.sig" "dist\$msi.sig"
          # Portable build for PCs where installing isn't allowed: the exe plus its sidecar,
          # which the runtime resolves next to the exe without the target-triple suffix.
          $portable = New-Item -ItemType Directory -Force portable
          Copy-Item "$rel\tallybot.exe" "$portable\TallyBot.exe"
          Copy-Item 'app\src-tauri\binaries\tallybot-sidecar-x86_64-pc-windows-msvc.exe' "$portable\tallybot-sidecar.exe"
          # The bundled firmware: a bare exe's resource dir is its own folder.
          Copy-Item -Recurse 'app\src-tauri\resources\firmware' "$portable\firmware"
          Compress-Archive -Path "$portable\*" -DestinationPath "dist\$zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  linux:
    needs: [version, firmware]
    # The oldest supported runner, so the AppImage and .deb link against an old glibc
    # and run on more distros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # The firmware this release ships, bundled so the in-app flasher installs exactly it.
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: app/src-tauri/resources/firmware
      - name: System libraries (Tauri + libudev for serialport)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libudev-dev patchelf file
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            app/pnpm-lock.yaml
            app/sidecar/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Install dependencies
        run: |
          pnpm -C app/sidecar install --frozen-lockfile
          pnpm -C app install --frozen-lockfile
      - name: Build
        run: pnpm -C app tauri build --config src-tauri/tauri.release.conf.json
        # Signs the installers for the in-app updater: the app trusts
        # only the public key in tauri.conf.json. The key has no password.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      # The packaged sidecar is a different program from the source CI tests (pkg runtime, bundle,
      # on-disk atem-connection worker), and the updater pushes a release to every install: boot
      # it before anything is attached.
      - name: Boot the packaged sidecar
        run: node app/sidecar/smoke-boot.mjs app/src-tauri/binaries/tallybot-sidecar-x86_64-unknown-linux-gnu
      - name: Collect packages
        run: |
          v=${{ needs.version.outputs.version }}
          # Asset names come from scripts/release-assets.mjs, which update-manifest.yml reads too.
          name() { node scripts/release-assets.mjs name "$1" "$v"; }
          b=app/src-tauri/target/release/bundle
          mkdir dist
          cp $b/appimage/*.AppImage "dist/$(name appimage)"
          cp $b/appimage/*.AppImage.sig "dist/$(name appimage).sig"
          cp $b/deb/*.deb "dist/$(name deb)"
          cp $b/rpm/*.rpm "dist/$(name rpm)"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  firmware:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      # Pinned like the platform and libraries in platformio.ini: a new PlatformIO core can
      # change how the release image is built. Bump deliberately.
      - run: pip install platformio==6.2.0
      # One image at offset 0x0 (merge_bin.py): what the web flasher, the in-app flasher and
      # a manual `esptool write_flash 0x0` all take. The staging script names it (and the
      # manifest beside it: firmware version + sha256, which the app reads) from
      # scripts/release-assets.mjs, so pages.yml and update-manifest.yml find them.
      - name: Build merged image
        run: |
          pio run -d firmware -e esp32-c3-release -t mergebin
          node app/scripts/stage-firmware.mjs firmware/.pio/build/esp32-c3-release/tallybot-merged.bin dist
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/*
          if-no-files-found: error

  # Every asset the release attaches is present under its contract name, and latest.json
  # builds from them: what update-manifest.yml does on publish, rehearsed here, so a renamed
  # bundle fails before a draft exists (and on a manual run, before any tag).
  assets:
    needs: [version, windows, linux, firmware]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Check the assets and dry-run latest.json
        run: |
          v=${{ needs.version.outputs.version }}
          node scripts/release-assets.mjs check-dist "$v" dist
          node scripts/release-assets.mjs manifest "$v" dist "https://example.invalid/dry-run"

  release:
    if: github.ref_type == 'tag'
    needs: [version, assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft --generate-notes --title "TallyBot ${{ needs.version.outputs.version }}"
