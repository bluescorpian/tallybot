name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Node + Rust run inside the flake's dev shell, so CI builds with the same
  # toolchain (and webkit/udev system libs) as local development.
  sidecar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Sidecar tests + typecheck
        working-directory: app/sidecar
        run: |
          nix develop ../.. -c pnpm install --frozen-lockfile
          nix develop ../.. -c pnpm test
          nix develop ../.. -c pnpm typecheck
      - name: Tools tests + typecheck
        working-directory: tools
        run: |
          nix develop .. -c pnpm install --frozen-lockfile
          nix develop .. -c pnpm test
          nix develop .. -c pnpm typecheck

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Frontend check + build
        working-directory: app
        run: |
          nix develop .. -c pnpm install --frozen-lockfile
          nix develop .. -c pnpm check
          nix develop .. -c pnpm build
      - name: Rust shell tests
        working-directory: app/src-tauri
        # Tauri's build script only checks the externalBin exists; the real
        # ~90 MB packaged sidecar isn't needed to compile or test the shell.
        run: |
          touch binaries/tallybot-sidecar-x86_64-unknown-linux-gnu
          nix develop ../.. -c cargo test --locked

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - name: Build dev + release envs
        working-directory: firmware
        run: pio run -e esp32-c3-devkitm-1 -e esp32-c3-release
