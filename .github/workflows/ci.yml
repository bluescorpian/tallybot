name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The app's versions agree and the shell's copies of the release asset names still match
  # scripts/release-assets.mjs. The firmware/VERSION-vs-last-tag check runs at release time only.
  release-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: node scripts/check-release.mjs

  # Node + Rust run inside the flake's dev shell, so CI builds with the same
  # toolchain (and webkit/udev system libs) as local development.
  sidecar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Sidecar tests + typecheck
        working-directory: app/sidecar
        run: |
          nix develop ../.. -c pnpm install --frozen-lockfile
          nix develop ../.. -c pnpm test
          nix develop ../.. -c pnpm typecheck
      - name: Tools tests + typecheck
        working-directory: tools
        run: |
          nix develop .. -c pnpm install --frozen-lockfile
          nix develop .. -c pnpm test
          nix develop .. -c pnpm typecheck

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Frontend check, tests + build
        working-directory: app
        run: |
          nix develop .. -c pnpm install --frozen-lockfile
          nix develop .. -c pnpm check
          nix develop .. -c pnpm test
          nix develop .. -c pnpm build
      - name: Rust shell tests
        working-directory: app/src-tauri
        # Tauri's build script only checks the externalBin exists; the real
        # ~90 MB packaged sidecar isn't needed to compile or test the shell.
        run: |
          touch binaries/tallybot-sidecar-x86_64-unknown-linux-gnu
          nix develop ../.. -c cargo test --locked

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      # Pinned like the platform and libraries in platformio.ini: a new PlatformIO core can
      # change how the release image is built. Bump deliberately.
      - run: pip install platformio==6.2.0
      - name: Build dev + release envs
        working-directory: firmware
        run: pio run -e esp32-c3-devkitm-1 -e esp32-c3-release
      # The release env is what both flashers ship; the dev env's plain-text USB logs would
      # corrupt the host's COBS stream, so its flag must never reach the release env.
      - name: Release env frames every byte
        working-directory: firmware
        run: |
          pio project config --json-output | jq -e '
            [.[] | select(.[0] == "env:esp32-c3-release") | .[1][] | select(.[0] == "build_flags") | .[1][]]
            | any(test("TALLYBOT_USB_TEXT_LOG")) | not'
