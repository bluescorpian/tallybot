name: Update manifest

# Writes latest.json, the file installed apps check for updates
# (releases/latest/download/latest.json, see plugins.updater in tauri.conf.json), and attaches
# it to the release. It runs on publish rather than in release.yml so the notes are the
# release's final, hand-edited text, and so a draft is never offered to anyone.
#
# The asset names, platform keys and manifest shape live in scripts/release-assets.mjs (read at
# the release's own tag, so they match what release.yml attached); release.yml dry-runs the
# same manifest step on every build.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the release
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # The published release; a manual run falls back to the latest one.
          TAG: ${{ github.event.release.tag_name }}
        run: echo "tag=${TAG:-$(gh release view --json tagName -q .tagName)}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
      - name: Write and attach latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          tag: ${{ steps.tag.outputs.tag }}
        run: |
          v=${tag#v}
          mkdir assets
          gh release download "$tag" --dir assets --pattern '*.sig' \
            --pattern "$(node scripts/release-assets.mjs name firmware-manifest)"
          gh release view "$tag" --json body,publishedAt > release.json
          node scripts/release-assets.mjs manifest "$v" assets \
            "https://github.com/$GH_REPO/releases/download/$tag" release.json > latest.json
          cat latest.json
          gh release upload "$tag" latest.json --clobber
