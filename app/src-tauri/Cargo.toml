[package]
name = "tallybot"
version = "1.0.0"
description = "TallyBot desktop app — reads ATEM Mini state and drives WiFi, USB and ESP-NOW tally lights"
authors = ["Harry Kruger"]
license = "PolyForm-Noncommercial-1.0.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tallybot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
# ~2.5: 2.6 needs a newer tauri than we pin.
tauri-plugin-autostart = "~2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# USB-serial provisioning (v1.2): the shell owns the port on a dedicated thread.
# Linux backend links libudev (provided by the flake dev shell); Windows uses a
# native backend. COBS framing + HELLO parse are hand-rolled in src/usb/protocol.rs.
serialport = "4"

