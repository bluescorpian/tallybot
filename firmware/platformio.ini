; TallyBot firmware — ESP32-C3 SuperMini
;
; The tally-light client: WiFi provisioning (captive portal), UDP discovery, the TCP
; binary protocol, and the onboard WS2812 LED. See README.md and ../ARCHITECTURE.md.
;
; Two non-obvious board facts are encoded below — see README.md for the full story:
;
;   * USB serial: the SuperMini's USB-C port is the chip's native USB Serial/JTAG
;     peripheral, not a UART bridge. `Serial` only reaches `pio device monitor` when
;     ARDUINO_USB_MODE=1 and ARDUINO_USB_CDC_ON_BOOT=1 are defined — without them the
;     board flashes fine but the monitor stays blank.
;
;   * LED: the onboard RGB LED on GPIO8 is addressable (WS2812), not a plain digital
;     pin. It must be driven via FastLED; digitalWrite(8, ...) does nothing.
;
; Dev loop:  pio run  |  pio run -t upload  |  pio device monitor

; ┌────────────────────────────────────────────────────────────────────────────┐
; │ WHICH ENV?                                                                   │
; │   Debugging firmware at a terminal  ........  esp32-c3-devkitm-1 (dev)       │
; │   Testing USB comms with the host app  ....  esp32-c3-release  ← USE THIS    │
; │                                                                              │
; │ The dev build prints plain-text logs onto the SAME USB wire as the COBS      │
; │ control frames, which CORRUPTS the host's COBS decoder. Any end-to-end USB   │
; │ test (detect / SET_COLOR / WiFi provisioning via the Tauri app) MUST run the │
; │ release build, where every byte is framed and the host stream decodes clean. │
; └────────────────────────────────────────────────────────────────────────────┘

; ── Dev environment (the default) ──────────────────────────────────────────────
; For developing firmware AT A TERMINAL — not for host USB-comms testing (see box above).
; Logs are plain Serial.print text (TALLYBOT_USB_TEXT_LOG) so `pio device monitor` and the
; exception decoder keep working. The release env below frames logs as COBS LOG packets.
[env:esp32-c3-devkitm-1]
; Pinned: an unpinned platform makes CI release builds pick up whatever is newest (7.1.3
; brought a new Arduino core), so the flasher would ship firmware nobody has run on a board.
; Bump deliberately, after testing on hardware.
platform = espressif32 @ 7.0.1
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
; Symbolise crash backtraces in the serial monitor — invaluable for networking faults.
monitor_filters = esp32_exception_decoder

; WiFiManager + WiFi + FastLED outgrow the default app partition; huge_app gives the
; headroom (no OTA in Phase 3, so the second app slot isn't needed).
board_build.partitions = huge_app.csv

; Stamp a real build timestamp into the binary (BUILD_TIMESTAMP) — the toolchain pins
; __DATE__/__TIME__ to 1980, so the diagnostics panel can't otherwise identify the build.
extra_scripts = pre:inject_build_time.py

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; Dev: emit plain-text logs to Serial instead of COBS LOG frames, so the USB monitor and
    ; esp32_exception_decoder stay usable. The release env omits this and frames every byte.
    -D TALLYBOT_USB_TEXT_LOG
    ; Uncomment to stream WiFiManager's own connection diagnostics to Serial (loud). The
    ; firmware's own logging is always on; this adds the library's internal blow-by-blow.
    ; -D WM_DEBUG

lib_deps =
    fastled/FastLED
    tzapu/WiFiManager@^2.0.17
    ; COBS framing for the USB-CDC control channel (v1.2). We use COBS mode + the
    ; (buffer, size) packet-handler overload.
    bakercp/PacketSerial@^1.4.0

; ── Release environment ──────────────────────────────────────────────────────────
; *** Flash THIS to test USB communication with the host app. ***
; Frames EVERYTHING on USB (no raw text): logs become COBS LOG frames, so the host stream
; decodes cleanly. The dev build's text logs would corrupt that stream — see the box at the
; top of this file. Build with `pio run -e esp32-c3-release` (add `-t upload` to flash).
[env:esp32-c3-release]
extends = env:esp32-c3-devkitm-1
; merge_bin.py adds `-t mergebin`: the single 0x0 image the release workflow ships to the
; web flasher. (extra_scripts doesn't merge with the base env, so the pre script is repeated.)
extra_scripts = pre:inject_build_time.py, merge_bin.py
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
