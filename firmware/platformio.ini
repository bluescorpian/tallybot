; TallyBot firmware — ESP32-C3 SuperMini
;
; The tally-light client: WiFi provisioning (captive portal), UDP discovery, the TCP
; binary protocol, and the onboard WS2812 LED. See README.md and ../ARCHITECTURE.md.
;
; Two non-obvious board facts are encoded below — see README.md for the full story:
;
;   * USB serial: the SuperMini's USB-C port is the chip's native USB Serial/JTAG
;     peripheral, not a UART bridge. `Serial` only reaches `pio device monitor` when
;     ARDUINO_USB_MODE=1 and ARDUINO_USB_CDC_ON_BOOT=1 are defined — without them the
;     board flashes fine but the monitor stays blank.
;
;   * LED: the onboard RGB LED on GPIO8 is addressable (WS2812), not a plain digital
;     pin. It must be driven via FastLED; digitalWrite(8, ...) does nothing.
;
; Dev loop:  pio run  |  pio run -t upload  |  pio device monitor

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
; Symbolise crash backtraces in the serial monitor — invaluable for networking faults.
monitor_filters = esp32_exception_decoder

; WiFiManager + WiFi + FastLED outgrow the default app partition; huge_app gives the
; headroom (no OTA in Phase 3, so the second app slot isn't needed).
board_build.partitions = huge_app.csv

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    fastled/FastLED
    tzapu/WiFiManager@^2.0.17
